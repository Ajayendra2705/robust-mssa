[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rmssa"
version = "0.3.0"
description = "Robust Multivariate Singular Spectrum Analysis for latent factor extraction in cross-sectional financial time series"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ajayendra Kumar Bansod", email = "ajayendrabansod2705@gmail.com" },
]
keywords = ["singular spectrum analysis", "mssa", "robust svd", "time series", "factor models"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
data = [
    "yfinance>=1.4",        # older versions hit Yahoo HTTP 429 / YFTzMissingError
    "curl_cffi>=0.7",       # browser impersonation to avoid Yahoo rate-limiting
    "pandas-datareader>=0.10",
    "statsmodels>=0.14",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "pyts>=0.13",  # external cross-validation of the SSA decomposition
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -m 'not external'"
markers = [
    "external: cross-checks against optional third-party libraries (e.g. pyts); slow, run with -m external",
]

[tool.ruff]
line-length = 100
target-version = "py310"
